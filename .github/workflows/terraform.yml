name: Terraform CI & Security Linting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Check Primary Terraform Formatting
        run: terraform fmt -check primary/

      - name: Check Secondary Terraform Formatting
        run: terraform fmt -check secondary/

      - name: Initialize Primary Configuration
        run: |
          cd primary
          terraform init -backend=false
          terraform validate

      - name: Initialize Secondary Configuration
        run: |
          cd secondary
          terraform init -backend=false
          terraform validate
